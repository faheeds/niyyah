name: Deploy (staging)

# Auto-deploys to the staging Cloudflare Worker on every merge to main.
# `pnpm build` generates dist/server/wrangler.json from vite.config.js's
# inline binding config (with a placeholder D1 database id); this patches
# in the real staging Worker name and D1 database id before deploying.
# See README-CLAUDE-GITHUB-SETUP.md for the one-time Cloudflare setup this
# depends on.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Patch Worker config for staging
        run: node scripts/patch-wrangler-config.mjs "niyyah-community-staging" "${{ secrets.CLOUDFLARE_D1_DATABASE_ID_STAGING }}"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Deploy the event-reminders Worker (P1-01b)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sed -i "s/__WORKER_NAME__/niyyah-community-reminders-staging/; s/__D1_DATABASE_ID__/${{ secrets.CLOUDFLARE_D1_DATABASE_ID_STAGING }}/" workers/reminders/wrangler.toml
          npx wrangler deploy --config workers/reminders/wrangler.toml
